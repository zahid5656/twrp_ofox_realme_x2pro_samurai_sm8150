name: OrangeFox 12.1 - samurai

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orangefox-12.1-samurai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FOX_ROOT: ${{ github.workspace }}/fox_12.1
      FOX_SYNC_ROOT: ${{ github.workspace }}/OrangeFox_sync

    steps:
      - name: Clean-up runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure 24 GB swap
        shell: bash
        run: |
          # Create swap file
          sudo mkdir -p /mnt/swapdir
          sudo fallocate -l 24G /mnt/swapdir/swapfile
          sudo chmod 600 /mnt/swapdir/swapfile
          
          # Format and enable swap
          sudo mkswap /mnt/swapdir/swapfile || echo "mkswap failed, trying with dd"
          sudo swapon /mnt/swapdir/swapfile || echo "swapon failed, continuing without swap"
          
          # Verify swap
          swapon --show || echo "No swap active"

      - name: Install OrangeFox build environment
        shell: bash
        run: |
          set -e
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts.git "$GITHUB_WORKSPACE/orangefox-build-env"
          sudo bash "$GITHUB_WORKSPACE/orangefox-build-env/setup/android_build_env.sh"

      - name: Sync OrangeFox 12.1
        shell: bash
        run: |
          set -e
          rm -rf "$FOX_SYNC_ROOT" "$FOX_ROOT"
          mkdir -p "$FOX_SYNC_ROOT"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$FOX_SYNC_ROOT/sync"
          cd "$FOX_SYNC_ROOT/sync"

          echo "Checking OrangeFox 12.1 manifest patch"
          test -f patches/patch-manifest-fox_12.1.diff
          echo "Found: patches/patch-manifest-fox_12.1.diff"

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_ROOT"

      - name: Verify synced source
        shell: bash
        run: |
          set -e
          cd "$FOX_ROOT"
          pwd
          ls -ld .repo build bootable/recovery vendor/recovery
          git -C bootable/recovery remote -v
          git -C vendor/recovery remote -v

      - name: Clone Samurai device tree
        shell: bash
        run: |
          set -e
          cd "$FOX_ROOT"
          mkdir -p device/realme
          rm -rf device/realme/samurai
          git clone \
            --branch fox-12.1-staging-backup \
            --single-branch \
            https://github.com/zahid5656/twrp_ofox_realme_x2pro_samurai_sm8150.git \
            device/realme/samurai
          cd device/realme/samurai
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify build environment
        shell: bash
        run: |
          set -e
          echo "=== System Resources ==="
          free -h
          df -h "$FOX_ROOT" || df -h
          echo "CPU Count: $(nproc)"
          grep "model name" /proc/cpuinfo | head -1
          
          echo ""
          echo "=== Device Tree Structure ==="
          cd "$FOX_ROOT"
          test -d device/realme/samurai || { echo "ERROR: Device tree directory missing"; exit 1; }
          test -f device/realme/samurai/BoardConfig.mk || { echo "ERROR: BoardConfig.mk missing"; exit 1; }
          test -f device/realme/samurai/device.mk || { echo "ERROR: device.mk missing"; exit 1; }
          test -f device/realme/samurai/recovery/root/system/etc/recovery.fstab || { echo "ERROR: recovery.fstab missing"; exit 1; }
          
          echo "Device tree verified:"
          ls -la device/realme/samurai/ | grep -E "\.mk|recovery"

      - name: Build OrangeFox recovery
        shell: bash
        run: |
          set -e
          set -o pipefail
          cd "$FOX_ROOT"

          export FOX_BUILD_DEVICE=samurai
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          export OF_MAINTAINER="ETHICAL ∆ TITAN"
          export FOX_MAINTAINER_PATCH_VERSION=1
          export USE_CCACHE=1
          export CCACHE_MAXSIZE="50G"

          echo "=== Sourcing build environment ==="
          source build/envsetup.sh

          echo "=== Verifying build setup ==="
          gettop
          echo "TOP=$TOP"
          echo "ANDROID_BUILD_TOP=$ANDROID_BUILD_TOP"
          echo "FOX_MANIFEST_ROOT=$FOX_MANIFEST_ROOT"
          echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"

          echo ""
          echo "=== Running lunch ==="
          lunch twrp_samurai-eng || { echo "ERROR: lunch failed"; exit 1; }
            
          echo "=== Build configuration ==="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "ANDROID_PRODUCT_OUT=$ANDROID_PRODUCT_OUT"

          test "$TARGET_PRODUCT" = "twrp_samurai" || { echo "ERROR: TARGET_PRODUCT mismatch"; exit 1; }
          test "$TARGET_DEVICE" = "samurai" || { echo "ERROR: TARGET_DEVICE mismatch"; exit 1; }
          test -n "$ANDROID_PRODUCT_OUT" || { echo "ERROR: ANDROID_PRODUCT_OUT not set"; exit 1; }

          echo ""
          echo "=== Setting up ccache ==="
          mkdir -p "$FOX_ROOT/.ccache/tmp"
          export CCACHE_DIR="$FOX_ROOT/.ccache"
          export CCACHE_TEMPDIR="$FOX_ROOT/.ccache/tmp"

          set +e

          echo ""
          echo "=== Starting build ==="
          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-samurai-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "==== BUILD LOG TAIL ===="
          tail -300 "$GITHUB_WORKSPACE/orangefox-samurai-build.log"

          echo ""
          echo "==== BUILD ERROR SUMMARY ===="
          grep -nEi "error:|FAILED|failed|ninja:|missing|No such file|undefined reference|fatal" \
            "$GITHUB_WORKSPACE/orangefox-samurai-build.log" | head -50 || echo "No errors found in summary"

          exit "$BUILD_STATUS"

      - name: Upload OrangeFox build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-build-log
          path: orangefox-samurai-build.log

      - name: Verify OrangeFox outputs
        shell: bash
        run: |
          set -e
          OUT="$FOX_ROOT/out/target/product/samurai"
          test -d "$OUT"

          shopt -s nullglob
          FOX_IMAGES=("$OUT"/OrangeFox*.img)
          FOX_ZIPS=("$OUT"/OrangeFox*.zip)

          if [ ${#FOX_IMAGES[@]} -eq 0 ]; then
            echo "Missing OrangeFox*.img"
            exit 1
          fi

          if [ ${#FOX_ZIPS[@]} -eq 0 ]; then
            echo "Missing OrangeFox*.zip"
            exit 1
          fi

          if [ ! -s "$OUT/recovery.img" ]; then
            echo "Missing or empty recovery.img"
            exit 1
          fi

          for file in "${FOX_IMAGES[@]}" "${FOX_ZIPS[@]}" "$OUT/recovery.img"; do
            test -s "$file"
            ls -lh "$file"
            sha256sum "$file"
          done

          echo "ORANGEFOX_OUT=$OUT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Publish OrangeFox release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-samurai-${{ github.run_id }}-${{ github.run_attempt }}
          name: Unofficial OrangeFox 12.1 for samurai // ${{ env.BUILD_DATE }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.ORANGEFOX_OUT }}/OrangeFox*.img
            ${{ env.ORANGEFOX_OUT }}/OrangeFox*.zip
            ${{ env.ORANGEFOX_OUT }}/recovery.img
          body: |
            OrangeFox base: 12.1
            Device: Realme X2 Pro / samurai
            Device tree branch: fox-12.1-staging-backup
            Device tree commit: ${{ env.DEVICE_TREE_COMMIT }}
            Workflow run: ${{ github.run_id }}
