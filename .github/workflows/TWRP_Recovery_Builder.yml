name: TWRP Recovery Builder - Realme X2 Pro

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twrp-recovery-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE: samurai
  DEVICE_PATH: device/realme/samurai
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-12.1
  BUILD_ROOT: ${{ github.workspace }}/workspace
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v7
        with:
          path: device-tree
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -e
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /usr/share/swift \
            /opt/hostedtoolcache/*
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            gh git gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libtinfo5 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get clean

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'

      - name: Install repo tool
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore TWRP source cache
        id: twrp-source-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/workspace/.repo
          key: twrp-source-${{ runner.os }}-12.1-seed-v1

      - name: Sync TWRP 12.1 source
        shell: bash
        run: |
          set -e
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"

          "$HOME/bin/repo" init \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:limit=10M \
            --no-clone-bundle \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH"

          "$HOME/bin/repo" sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --fail-fast \
            -j4

      - name: Save TWRP source cache
        if: steps.twrp-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/workspace/.repo
          key: twrp-source-${{ runner.os }}-12.1-seed-v1

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.ccache
          key: twrp-ccache-${{ runner.os }}-12.1-samurai-v1

      - name: Prepare ccache
        shell: bash
        run: |
          set -e
          mkdir -p "$CCACHE_DIR"
          ccache -M 512M
          ccache --set-config=compression=true

      - name: Add Samurai device tree
        shell: bash
        run: |
          set -e
          mkdir -p "$BUILD_ROOT/$DEVICE_PATH"
          rsync -a --exclude='.git/' \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$BUILD_ROOT/$DEVICE_PATH/"

      - name: Build TWRP recovery
        shell: bash
        run: |
          set -e
          set -o pipefail

          cd "$BUILD_ROOT"

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$CCACHE_DIR"

          source build/envsetup.sh
          lunch "twrp_${DEVICE}-eng"
          mka recoveryimage -j"$(nproc --all)"

      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/.ccache
          key: twrp-ccache-${{ runner.os }}-12.1-samurai-v1

      - name: Publish recovery.img
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          RECOVERY="$BUILD_ROOT/out/target/product/$DEVICE/recovery.img"
          test -s "$RECOVERY"

          TAG="twrp-samurai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" \
            "$RECOVERY" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TWRP 12.1 Realme X2 Pro - ${GITHUB_SHA::12}"
