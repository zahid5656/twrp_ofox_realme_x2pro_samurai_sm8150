name: TWRP Recovery Builder - Realme X2 Pro

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twrp-recovery-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE: samurai
  DEVICE_PATH: device/realme/samurai
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-12.1
  OUT_DIR: out/target/product/samurai
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout private Samurai device tree
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: device-tree
          fetch-depth: 1
          persist-credentials: false

      - name: Clean GitHub-hosted runner and maximize disk headroom
        shell: bash
        run: |
          set -euxo pipefail

          echo '=== Runner state before cleanup ==='
          df -hT
          free -h || true
          swapon --show || true

          # This recovery build does not use Docker/containers or the large
          # preinstalled SDK/toolchains below. Remove only disposable runner
          # content; never touch $GITHUB_WORKSPACE or checked-out repositories.
          sudo systemctl stop docker.service docker.socket containerd.service 2>/dev/null || true
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/* \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /opt/microsoft \
            /opt/az \
            /var/lib/docker \
            /var/lib/containerd \
            /home/runner/.cache || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* || true

          # GitHub's standard runner currently has a disk-backed /swapfile.
          # Prefer zram; only remove /swapfile after zram is actually active.
          zram_ready=false
          if swapon --show --noheadings --raw --output=NAME | grep -qx '/dev/zram0'; then
            zram_ready=true
          elif sudo modprobe zram num_devices=1 2>/dev/null && [ -e /sys/block/zram0/disksize ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 1 | sudo tee /sys/block/zram0/reset >/dev/null 2>&1 || true
            if echo $((4 * 1024 * 1024 * 1024)) | sudo tee /sys/block/zram0/disksize >/dev/null \
              && sudo mkswap /dev/zram0 \
              && sudo swapon -p 100 /dev/zram0; then
              zram_ready=true
            fi
          fi

          if [ "$zram_ready" = true ] \
            && swapon --show --noheadings --raw --output=NAME | grep -qx '/swapfile'; then
            sudo swapoff /swapfile
            sudo rm -f /swapfile
          fi

          echo '=== Runner state after cleanup ==='
          df -hT
          free -h || true
          swapon --show || true

      - name: Select build filesystem
        shell: bash
        run: |
          set -euxo pipefail

          root_dev="$(df -P "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')"
          root_free="$(df -PB1 "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          mnt_dev="$(df -P /mnt | awk 'NR==2 {print $1}')"
          mnt_free="$(df -PB1 /mnt | awk 'NR==2 {print $4}')"

          if [ "$mnt_dev" != "$root_dev" ] && [ "$mnt_free" -gt "$root_free" ]; then
            build_root="/mnt/twrp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            build_root="$GITHUB_WORKSPACE/workspace"
          fi

          mkdir -p "$build_root"
          echo "BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          echo "Selected BUILD_ROOT=$build_root"
          df -hT "$build_root"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            gh git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libbz2-dev libelf-dev libgflags-dev libgl1-mesa-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libtinfo5 \
            libxml2-utils libwxgtk3.0-gtk3-dev lzma lzop ncftp pngcrush \
            qemu-user-static rsync schedtool squashfs-tools x11proto-core-dev \
            xsltproc zip zlib1g-dev

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* || true
          df -hT

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP 12.1 source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT"
          "$HOME/bin/repo" init \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:limit=10M \
            --no-clone-bundle \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH"

      - name: Sync TWRP source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT"
          "$HOME/bin/repo" sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --fail-fast \
            -j4

          echo '=== Disk state after repo sync ==='
          df -hT "$BUILD_ROOT"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: /home/runner/.ccache
          key: twrp-ccache-${{ runner.os }}-12.1-samurai-${{ github.sha }}
          restore-keys: |
            twrp-ccache-${{ runner.os }}-12.1-samurai-

      - name: Configure bounded ccache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -M 1G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -c
          ccache -s

      - name: Install exact Samurai device tree into TWRP source
        shell: bash
        run: |
          set -euxo pipefail

          source_tree="$GITHUB_WORKSPACE/device-tree"
          checked_sha="$(git -C "$source_tree" rev-parse HEAD)"
          test "$checked_sha" = "$GITHUB_SHA"

          target_tree="$BUILD_ROOT/$DEVICE_PATH"
          if [ -e "$target_tree" ]; then
            echo "Refusing to overwrite unexpected existing path: $target_tree" >&2
            exit 1
          fi

          mkdir -p "$target_tree"
          rsync -a --exclude='.git/' "$source_tree/" "$target_tree/"
          echo "Device tree commit: $checked_sha"

      - name: Validate Samurai build inputs
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT"
          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/twrp_${DEVICE}.mk"
          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/device.mk"
          test -s "$DEVICE_PATH/prebuilt/Image.gz-dtb"
          test -s "$DEVICE_PATH/prebuilt/dtbo.img"
          grep -q 'COMMON_LUNCH_CHOICES := twrp_samurai-eng' "$DEVICE_PATH/AndroidProducts.mk"
          grep -q '^TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/Image.gz-dtb' "$DEVICE_PATH/BoardConfig.mk"
          grep -q '^BOARD_PREBUILT_DTBOIMAGE := $(DEVICE_PATH)/prebuilt/dtbo.img' "$DEVICE_PATH/BoardConfig.mk"
          df -hT "$BUILD_ROOT"

      - name: Build TWRP recovery
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT"

          free_bytes="$(df -PB1 "$BUILD_ROOT" | awk 'NR==2 {print $4}')"
          if [ "$free_bytes" -lt $((12 * 1024 * 1024 * 1024)) ]; then
            ccache -M 512M
            ccache -c
          fi

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$CCACHE_DIR"

          source build/envsetup.sh
          lunch twrp_${DEVICE}-eng
          mka recoveryimage -j"$(nproc --all)"

          ccache -s || true
          df -hT "$BUILD_ROOT"

      - name: Verify recovery.img
        id: verify
        shell: bash
        run: |
          set -euxo pipefail
          RECOVERY="$BUILD_ROOT/$OUT_DIR/recovery.img"
          test -s "$RECOVERY"
          cp "$RECOVERY" "$GITHUB_WORKSPACE/recovery.img"
          cd "$GITHUB_WORKSPACE"
          sha256sum recovery.img | tee recovery.img.sha256
          echo "sha256=$(cut -d' ' -f1 recovery.img.sha256)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Publish recovery.img to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SHA256: ${{ steps.verify.outputs.sha256 }}
          SHORT_SHA: ${{ steps.verify.outputs.short_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="twrp-samurai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TITLE="TWRP 12.1 for Realme X2 Pro (samurai) - ${SHORT_SHA}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/recovery.img" \
            "$GITHUB_WORKSPACE/recovery.img.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "TWRP recovery build for Realme X2 Pro (samurai / RMX1931 family).\n\nManifest: ${MANIFEST_BRANCH}\nDevice tree: ${GITHUB_SHA}\nrecovery.img SHA-256: ${RECOVERY_SHA256}"
