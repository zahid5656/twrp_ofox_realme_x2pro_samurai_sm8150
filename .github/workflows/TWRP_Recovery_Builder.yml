name: OrangeFox 12.1 - samurai

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clean runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install Android build environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "${GITHUB_WORKSPACE}/OrangeFox/fox_12.1"

      - name: Clone samurai device tree
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_12.1"
          mkdir -p device/realme
          git clone \
            --branch fox-12.1-staging-backup \
            --single-branch \
            https://github.com/zahid5656/twrp_ofox_realme_x2pro_samurai_sm8150.git \
            device/realme/samurai

      - name: Build recovery
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_12.1"
          export FOX_BUILD_DEVICE=samurai
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_MAINTAINER="ETHICAL ∆ TITAN"
          export FOX_MAINTAINER_PATCH_VERSION=1
          source build/envsetup.sh
          lunch twrp_samurai-eng
          mka recoveryimage

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-samurai
          path: |
            OrangeFox/fox_12.1/out/target/product/samurai/OrangeFox*.img
            OrangeFox/fox_12.1/out/target/product/samurai/OrangeFox*.zip
          if-no-files-found: error
